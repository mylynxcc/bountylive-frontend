name: bountylive
description: BountyLive - Live Challenge Marketplace
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Networking
  dio: ^5.7.0
  retrofit: ^4.4.2
  json_annotation: ^4.9.0

  # Local Storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI Components
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.17
  lottie: ^3.3.1
  flutter_staggered_animations: ^1.1.0
  flutter_screenutil: ^5.9.3
  material_design_icons_flutter: ^7.0.7296
  flutter_animate: ^4.5.2
  smooth_page_indicator: ^1.2.1
  badges: ^3.1.2
  skeletonizer: ^1.4.2
  timeago: ^3.7.0
  glassmorphism: ^3.0.0

  # Video / Streaming
  livekit_client: ^2.9.1
  video_player: ^2.9.2
  chewie: ^1.10.0

  # Chat
  emoji_picker_flutter: ^4.3.0
  giphy_get: ^3.4.2

  # Authentication
  local_auth: ^2.3.0
  sign_in_with_apple: ^6.1.4
  google_sign_in: ^6.2.2
  firebase_auth: ^5.4.2
  firebase_core: ^3.12.1
  flutter_facebook_auth: ^7.1.1
  pin_code_fields: ^8.0.1

  # Media
  image_picker: ^1.1.2
  photo_view: ^0.15.0
  flutter_image_compress: ^2.3.0
  permission_handler: ^11.3.1
  file_picker: ^8.1.7

  # Payments
  flutter_stripe: ^11.4.0
  paystack_flutter: ^1.0.4
  flutterwave_standard: ^1.0.3

  # Notifications
  firebase_messaging: ^15.2.2
  flutter_local_notifications: ^18.0.1

  # Maps
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Analytics
  firebase_analytics: ^11.4.2

  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  package_info_plus: ^8.1.3
  device_info_plus: ^11.3.3
  connectivity_plus: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  json_serializable: ^6.9.4
  retrofit_generator: ^9.1.7
  riverpod_generator: ^2.6.3
  hive_generator: ^2.0.1
  mockito: ^5.4.6
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/animations/
    - assets/lottie/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app-icon.png"
  adaptive_icon_background: "#0D1117"
  adaptive_icon_foreground: "assets/icons/app-icon.png"
  min_sdk_android: 24
  remove_alpha_ios: true

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
