// =============================================================================
// BountyLive – Android App Build Configuration
// =============================================================================

plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
    id "com.google.firebase.crashlytics"
}

// =============================================================================
// Release Signing (key.properties in android/)
// =============================================================================

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// =============================================================================
// Android
// =============================================================================

android {
    namespace = "com.bountylive.app"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    buildFeatures {
        buildConfig = true              // needed for BuildConfigField
    }

    compileOptions {
        coreLibraryDesugaringEnabled = true  // required by flutter_local_notifications
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "com.bountylive.app"
        minSdk = 24
        targetSdk = 36
        versionCode = 1
        versionName = "1.0.0"
        multiDexEnabled = true

        // Override via --dart-define=API_BASE_URL=... at build time
        buildConfigField "String", "API_BASE_URL",
                "\"${System.getenv('API_BASE_URL') ?: 'https://api.bountylive.com/api/v1'}\""
    }

    signingConfigs {
        release {
            keyAlias = keystoreProperties['keyAlias']
            keyPassword = keystoreProperties['keyPassword']
            storeFile = keystoreProperties['storeFile']
                    ? file(keystoreProperties['storeFile'])
                    : null
            storePassword = keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            minifyEnabled = true
            shrinkResources = true
            proguardFiles(
                    getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
            )
            ndk {
                abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
            }
        }
        debug {
            signingConfig = signingConfigs.debug
            applicationIdSuffix = '.debug'
            versionNameSuffix = '-debug'
        }
    }

    bundle {
        density { enableSplit = true }
        abi     { enableSplit = true }
        language { enableSplit = false }
    }
}

// =============================================================================
// Kotlin Toolchain
// =============================================================================

kotlin {
    jvmToolchain(17)
}

// =============================================================================
// Flutter
// =============================================================================

flutter {
    source = "../.."
}

// =============================================================================
// Dependencies
// =============================================================================

dependencies {
    // Multi-dex support
    implementation 'androidx.multidex:multidex:2.0.1'

    // Firebase Bill of Materials
    implementation platform('com.google.firebase:firebase-bom:33.6.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-analytics'

    // Core library desugaring (required by flutter_local_notifications on SDK 36)
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}
